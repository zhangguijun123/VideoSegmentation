video:
  input_path: "temp/normalized_input.mp4"
  output_dir: "output"
  output_format: "mp4"
  temp_dir: "temp"
  transcode_input: true
  transcode_format: "mp4"

scene_detection:
  method: "content"   # content | threshold | adaptive
  threshold: 27.0
  min_scene_length: 2.0
  merge_min_length: 120.0  # 将短镜头合并到至少 30 秒，更接近完整对话段落

speech_recognition:
  model: "base"
  language: "ja"
  auto_detect: true
keywords:
  max_keywords_per_scene: 8
  parts_of_speech: ["動詞"]
  min_frequency: 1
  stopwords_path: "data/stopwords_ja.txt"
subtitle:
  show_keywords: true
  show_dialogue: false
  position: "top_right"
  font_size: 30
  font_color: "white"
  font_weight: "normal"  # normal | bold
  box_color: "black"
  box_opacity: 0.45
  margin: 20
  line_spacing: 6
  font_path: ""
  dialogue_position: "bottom_center"
  dialogue_font_size: 45  # 增加字体大小，考虑缩放因素后视觉上更明显
  dialogue_font_color: "white"
  dialogue_font_weight: "bold"  # normal | bold
  dialogue_box_color: "black"
  dialogue_box_opacity: 0.45
  dialogue_margin: 38  # 向上提高10像素（从28增加到38）
  dialogue_line_spacing: 8
  dialogue_max_chars_per_line: 18
  dialogue_max_lines: 1
  original_max_lines: 1
  translation_max_lines: 1
  dialogue_display_mode: "original_only"  # both | original_only | translation_only
  keywords_position: "left_vertical"  # left_vertical | top_right | bottom_left | none
  keywords_max_display: 10
  keywords_box_enabled: true  # true = 显示背景框，false = 透明背景（无框）
  keywords_font_color: "yellow"  # 关键词字体颜色 yellow、gold、cyan、orange、red
  keywords_font_weight: "bold"  # normal | bold
  keywords_font_size: 30  # 关键词字体大小（像素），设置为普通字体的两倍
  keywords_font_outline_enabled: true  # 是否启用字体描边（透明背景时）
  keywords_font_outline_color: "black@1.0"  # 描边颜色（全不透明度，更显眼）
  keywords_font_outline_width: 8  # 描边宽度（像素），增大以模拟加粗效果
  keywords_font_shadow_enabled: true  # 是否启用阴影效果
  keywords_font_shadow_x: 3  # 阴影X偏移
  keywords_font_shadow_y: 3  # 阴影Y偏移
  keywords_font_shadow_color: "black@0.6"  # 阴影颜色
  japanese_font_path: ""
  chinese_font_path: ""
  logo_text: ""
  logo_image_path: "logo.jpg"
  logo_scale: 0.06
  logo_max_width: 80
  logo_animation: "bounce_right"  # none | slide_right | slide_left | bounce_right
  logo_animation_speed: 2.0  # 动画速度倍数（仅对bounce_right有效）





  logo_position: "top_left"
  logo_font_size: 24

  logo_font_color: "white"
  logo_box_color: "black"
  logo_box_opacity: 0.45
  logo_margin: 10

  logo_font_path: ""
  logo_max_chars_per_line: 0










translation:
  enabled: true
  target_language: "zh-CN"
  show_original: true
  translator: "googletrans"
  api_timeout: 10








